<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    .header {
      background-color: #1f5f78;
      color: white;
      font-weight: bold;
      padding: 10px;
      font-size: 20px;
    }
  </style>
</head>
<body>
<div class="container">
 <div class="row align-items-start">
      <!-- Sensor Values -->
 <!-- LEFT: Horizontal Bar Chart -->
    <div class="col-md-6">
      <h4>Horizontal Bar Chart</h4>
      <div id="chartBar"></div>
       <div class="header mt-4">Sensor States</div>
       <table class="table table-bordered border-dark text-center">
          <tr class="table-primary text-dark">
            <td>Sensor1</td>
            <td>Sensor2</td>
            <td>Sensor3</td>
            <div class="w-100"></div>
            <td>Sensor4</td>
             <td>Sensor5</td>
          </tr>
        </tbody>
        </table>
    </div>

    <!-- RIGHT: Table + Line Charts -->
    <div class="col-md-6">

      <!-- TABLE (TOP RIGHT) -->
      <table class="table table-bordered border-dark text-center">
        <thead class="bg-primary text-white">
          <tr>
            <th>Sensor1</th>
            <th>Sensor2</th>
            <th>Sensor3</th>
            <th>Sensor4</th>
            <th>Sensor5</th>
          </tr>
        </thead>
        <tbody>
          <tr class="table-primary text-dark">
            <td>Values1</td>
            <td>Values2</td>
            <td>Values3</td>
            <td>Values4</td>
            <td>Values5</td>
          </tr>
        </tbody>
      </table>

      <!-- LINE CHARTS UNDER TABLE -->
      <h4 class="mt-4">Line Chart 1</h4>
      <div id="chart1"></div>

      <h4 class="mt-4">Line Chart 2</h4>
      <div id="chart2"></div>

    </div>

  </div>
</div>
<script>
  // LINE CHART 1
  var options1 = {
    series: [
      { name: "Sensor 1", data: [10, 20, 30, 40, 50] },
      { name: "Sensor 2", data: [42, 7, 89, 16, 53] }
    ],
    chart: { type: 'line', height: 300 },
    xaxis: { categories: ['1','2','3','4','5'] }
  };
  var chart1 = new ApexCharts(document.querySelector("#chart1"), options1);
  chart1.render();

  // LINE CHART 2
  var options2 = {
    series: [
      { name: "Sensor 2", data: [5, 15, 25, 35, 45] },
      { name: "Sensor 3", data: [42, 7, 89, 16, 53] }
    ],
    chart: { type: 'line', height: 300 },
    xaxis: { categories: ['1','2','3','4','5'] }
  };
  var chart2 = new ApexCharts(document.querySelector("#chart2"), options2);
  chart2.render();

  // HORIZONTAL BAR CHART
  var optionsBar = {
    series: [
      { name: "Sensor 1", data: [44, 55, 41, 64, 22, 43, 21] },
      { name: "Sensor 2", data: [53, 32, 33, 52, 13, 44, 32] }
    ],
    chart: { type: 'bar', height: 400 },
    plotOptions: { bar: { horizontal: true } },
    xaxis: { categories: ['2001','2002','2003','2004','2005','2006','2007'] }
  };
  var chartBar = new ApexCharts(document.querySelector("#chartBar"), optionsBar);
  chartBar.render();
</script>
</body>
</html>
