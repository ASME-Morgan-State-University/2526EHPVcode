<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    .header {
      background-color: #1f5f78;
      color: white;
      font-weight: bold;
      padding: 10px;
      font-size: 20px;
    }

    .status-circle {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: inline-block;
      border: 2px solid #333;
    }

    .green { background-color: #4CAF50; }
    .red { background-color: #f44336; }

    td { vertical-align: middle; }
  </style>
</head>

<body>

<div class="container mt-4">
  <div class="row">

    <!-- LEFT SIDE: Tables -->
    <div class="col-md-6">

      <!-- Sensor Values -->
      <table class="table table-bordered border-dark text-center">
        <thead class="bg-primary text-white">
          <tr>
            <th>Sensor1</th>
            <th>Sensor2</th>
            <th>Sensor3</th>
          </tr>
        </thead>
        <tbody>
          <tr class="table-primary text-dark">
            <td>Values1</td>
            <td>Values2</td>
            <td>Values3</td>
          </tr>
        </tbody>
      </table>

      <!-- Sensor States -->
      <div class="header mt-4">Sensor States</div>
      <table class="table table-bordered text-center">
        <tbody>
          <tr>
            <td class="text-start">Sensor 1</td>
            <td><span class="status-circle green"></span></td>
            <td><span class="status-circle red"></span></td>
          </tr>
          <tr>
            <td class="text-start">Sensor 2</td>
            <td><span class="status-circle green"></span></td>
            <td><span class="status-circle red"></span></td>
          </tr>
          <tr>
            <td class="text-start">Sensor 3</td>
            <td><span class="status-circle green"></span></td>
            <td><span class="status-circle red"></span></td>
          </tr>
          <tr>
            <td class="text-start">Sensor 4</td>
            <td><span class="status-circle green"></span></td>
            <td><span class="status-circle red"></span></td>
          </tr>
        </tbody>
      </table>

    </div>

    <!-- RIGHT SIDE: Charts -->
    <div class="col-md-6">

      <h4>Line Chart 1</h4>
      <div id="chart1"></div>

      <h4 class="mt-4">Line Chart 2</h4>
      <div id="chart2"></div>

      <h4 class="mt-4">Horizontal Bar Chart</h4>
      <div id="chartBar"></div>

    </div>

  </div> <!-- End row -->
</div> <!-- End container -->

<script>
  // LINE CHART 1
  var options1 = {
    series: [
      { name: "Sensor 1", data: [10, 20, 30, 40, 50] },
      { name: "Sensor 2", data: [42, 7, 89, 16, 53] }
    ],
    chart: { type: 'line', height: 300 },
    xaxis: { categories: ['1','2','3','4','5'] }
  };
  var chart1 = new ApexCharts(document.querySelector("#chart1"), options1);
  chart1.render();

  // LINE CHART 2
  var options2 = {
    series: [
      { name: "Sensor 2", data: [5, 15, 25, 35, 45] },
      { name: "Sensor 3", data: [42, 7, 89, 16, 53] }
    ],
    chart: { type: 'line', height: 300 },
    xaxis: { categories: ['1','2','3','4','5'] }
  };
  var chart2 = new ApexCharts(document.querySelector("#chart2"), options2);
  chart2.render();

  // HORIZONTAL BAR CHART
  var optionsBar = {
    series: [
      { name: "Sensor 1", data: [44, 55, 41, 64, 22, 43, 21] },
      { name: "Sensor 2", data: [53, 32, 33, 52, 13, 44, 32] }
    ],
    chart: { type: 'bar', height: 400 },
    plotOptions: { bar: { horizontal: true } },
    xaxis: { categories: ['2001','2002','2003','2004','2005','2006','2007'] }
  };
  var chartBar = new ApexCharts(document.querySelector("#chartBar"), optionsBar);
  chartBar.render();
</script>

</body>
</html>
