<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
        .header {
        background-color: #1f5f78;
        color: white;
        font-weight: bold;
        padding: 10px;
        font-size: 20px;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="row align-items-start">
        
          <!-- LEFT: Horizontal Bar Chart -->
          <div class="col-md-6">
            <h4>Power average</h4>
            <div id="chartBar" style="height: 400px;"></div>



                <!-- Sensor States --> 
            <div class="header mt-4">Sensor States</div>
            <table id="sensorStateTable" class="table table-bordered text-center mt-2">
              <thead class="">
                <tr>
                  <th>Sensor:GPS</th>
                  <th>Sensor:AUX</th>
                  <th>Sensor:Motor</th>
                  <th>Sensor:IMU</th>
                  <th>Sensor:Temp</th>
                </tr>
              </thead>
            </table>
        </div>

            <!-- RIGHT: Table + Line Charts -->
          <div class="col-md-6">
             <!-- Sensor Values -->

            <table id="mainDataTable" class="table table-bordered border-dark text-center">
               <thead class="bg-primary text-white ">
                <tr>
                  <th>GPS</th>
                  <th>Aux</th>
                  <th>Motor</th>
                  <th>IMU</th>
                  <th>Temp</th>
                </tr>
                 </thead>
                    <tbody>
                      <tr class="table-primary text-dark w-25 d-block">
                        <div class="d-flex justify-content-center align-items-center" style="height: 100px;">
               <tbody>
                  <tr class="table-primary text-dark">
                    <td>
                      <div class="lat">0</div>
                      <div class="lon">0</div>
                      <div class="SD">0</div>
                    </td>
                    <td>
                      <div class="Voltage">0</div>
                      <div class="Current">0</div>
                    </td>
                    <td>
                      <div class="Voltage">0</div>
                      <div class="Current">0</div>
                    </td>
                    <td>
                      <div class="Xaccel">0</div>
                      <div class="yaccel">0</div>
                      <div class="zaccel">0</div>
                      <div class="Pitch">0</div>
                      <div class="Yaw">0</div>
                      <div class="Roll">0</div>
                      <div class="Xmag">0</div>
                      <div class="Ymag">0</div>
                      <div class="Zmag">0</div>
                    </td>
                    <td>
                      <div class="Temp">0</div>
                      <div class="Hum">0</div>
                    </td>
                  </tr>
</tbody>
                    </tbody>
                </thead> 
            </table>
             <!-- graphs 1-2-->
                <h4 class="mt-4">Sensor History</h4>
                  <div id= chart1 style="height: 300px;"></div>
                <h4 class="mt-4">Voltage/Current</h4>
                <div id= chart2 style="height: 300px;"></div>
        </div>
      </div>
    </body>
  </html>
           <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"> </script>
           <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
           <script src="static/app.js"></script>
</html>
