<!DOCTYPE html>
  <html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mono - Responsive Admin & Dashboard Template</title>

    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css?family=Karla:400,700|Roboto" rel="stylesheet">
    <link href="plugins/material/css/materialdesignicons.min.css" rel="stylesheet" />
    <link href="plugins/simplebar/simplebar.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='plugins/nprogress/nprogress.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='plugins/jvectormap/jquery-jvectormap-2.0.3.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='plugins/daterangepicker/daterangepicker.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="images/favicon.png" rel="shortcut icon" />
  
    <script src="plugins/nprogress/nprogress.js"></script>
  </head>

    <body>
      <div class="navbar-fixed sidebar-fixed" id="body">
          <div class="container-fluid">
              <div class="row">
                <!-- LEFT COLUMN -->
                  <div class="col-md-6">
                    <!-- Power Average -->
                    <div class="card card-default" id="acquisition-report">
                      <div class="card-header"><h2>Power Average</h2></div>
                        <div class="card-body">
                        <canvas id="power-average-chart"></canvas>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                      <!-- Sensor Values Table --> 
                    <div class="card card-default" id="page-views">
                      <div class="card-header"><h2>Sensor Values</h2></div>
                      <div class="card-body py-0" data-simplebar>
                        <table class="table table-borderless table-thead-border sensor-table">
                          <thead>
                              <tr>
                              <th>Sensor</th>
                              <th class="text-right px-2">Value 1</th>
                              <th class="text-right">Value 2</th>
                              <th class="text-right">Value 3</th>
                            </tr>
                          </thead>
                              <tbody>
                                <tr>
                                  <td class="text-primary">Sensor1</td>
                                  <td class="text-right"><span id="latitude">---</span>°</td>
                                  <td class="text-right"><span id="longitude">---</span>°</td>
                                  <td class="text-right"><span id="Satellitecount">---</span>°</td>
                                  </tr>
                                <tr>
                                <td class="text-primary">Sensor2</td>
                                <td class="text-right"><span id="Auxvoltage">---</span>V</td>
                                <td class="text-right"><span id="Auxcurrent">---</span>A</td>
                                <td class="text-right"></td>
                                </tr>
                                <tr>
                                  <td class="text-primary">Sensor3</td>
                                  <td class="text-right"><span id="Motorvoltage">---</span>V</td>
                                  <td class="text-right"><span id="Motorcurrent">---</span>A</td>
                                  <td class="text-right"></td>
                                </tr>
                                <tr>
                                  <td class="text-primary">Sensor4</td>
                                  <td class="text-right"><span id="Xaccel">---</span> m/s²</td>
                                  <td class="text-right"><span id="Yaccel">---</span> m/s²</td>
                                  <td class="text-right"><span id="Zaccel">---</span> m/s²</td>
                                </tr>
                                <tr>
                                  <td class="text-primary">Sensor4-1</td>
                                  <td class="text-right"><span id="Xmag">---</span> G</td>
                                  <td class="text-right"><span id="Ymag">---</span> G</td>
                                  <td class="text-right"><span id="Zmag">---</span> G</td>
                                </tr>
                                <tr>
                                  <td class="text-primary">Sensor4-2</td>
                                  <td class="text-right"><span id="Pitch">---</span>°</td>
                                  <td class="text-right"><span id="Roll">---</span>°</td>
                                  <td class="text-right"><span id="Yaw">---</span>°</td>
                                </tr>
                                <tr>
                                  <td class="text-primary">Sensor5</td>
                                  <td class="text-right"><span id="Temp">---</span>°C</td>
                                  <td class="text-right"><span id="Hum">---</span>°C</td>
                                  <td class="text-right"></td>
                                </tr>
                              </tbody>
                        </table>
                      </div>
                    </div>
                    <div class="card-footer bg-white py-4">
                      <a href="#" class="text-uppercase">Audience Overview</a>
                    </div>
                  </div>
              </div>
              <div class="row mt-2">
                <div class="col-md-5">
                  <!-- Sensor History Graph -->
                  <div class="card card-default" id="voltage-history-card">
                    <div class="card-header"><h2>Voltage/Current History</h2></div>
                      <div class="card-body">
                        <canvas id="power-chart"></canvas>
                      </div>
                    </div>
                  </div> 
                </div>
                <!-- End Right Column -->
                <div = class="col-md-7">
                    <div class="card card-default" id="sensor-history-card">
                      <div class="card-header"><h2>Sensor History</h2></div>
                      <div class="card-body">
                        <canvas id="sensor-history-chart"></canvas>
                      </div>
                    </div>
                </div>
              </div>
          </div>
      </div>
      <!-- JS -->
      <script src="{{ url_for('static', filename='plugins/jquery/jquery.min.js') }}"></script>
      <script src="{{ url_for('static', filename='plugins/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
      <script src="{{ url_for('static', filename='plugins/simplebar/simplebar.min.js') }}"></script>
      <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
      <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
      <script src="{{ url_for('static', filename='js/app.js') }}"></script>
      
    </body>
</html>
